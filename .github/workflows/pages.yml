name: Pages (pre-rendered)

# Every WBC dashboard as static pages that open at once: scripts/prerender.py runs each unchanged
# Streamlit app once per widget state (language, player, season, stadium, density, pitch type, ...)
# and writes the HTML and figures; https://yasumorishima.github.io/wbc-scouting/
#   render  one job per dashboard (a heavy one is split, see SHARDS in build_pages.py); before its
#           states are kept, scripts/prerender_check.py runs sampled states in the real Streamlit
#           runtime (AppTest) and requires the same output;
#   verify  makes the pages from the parts, writes the index, stops above SIZE_LIMIT_MB, then opens
#           the built site in Chromium (scripts/pages_check.py: every page, every state, every
#           control option) and hands it to deploy only if everything passes;
#   deploy  publishes; a manual run publishes only from master with every dashboard checked
#           (publish = false, a branch, or `only` make it a dry run);
#   check   the same browser check on the published site; summary and screenshots go to the
#           `pages-check` branch (replaced on every run).

on:
  push:
    branches: [master]
    paths:
      - "app_*.py"
      - "players*.py"
      - "scouting_lib.py"
      - "data/**"
      - "scripts/build_pages.py"
      - "scripts/prerender*.py"
      - "scripts/prerender_page.*"
      - "scripts/st_record.py"
      - "scripts/render_html.py"
      - "scripts/requirements-pages.txt"
      - "scripts/pages_check.py"
      - ".github/workflows/pages.yml"
  # Data refreshes commit with GITHUB_TOKEN, which does not trigger push workflows.
  workflow_run:
    workflows: ["Fetch Statcast Data", "Fetch All Countries Statcast", "Generate Player Files"]
    types: [completed]
  workflow_dispatch:
    inputs:
      memo:
        description: "why this run"
        required: false
      only:
        description: "check only these dashboards in the browser (comma-separated slugs); empty = all"
        required: false
      publish:
        description: "publish the site (only from master and with `only` empty; false = build and check only)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SIZE_LIMIT_MB: 950   # GitHub Pages publishes at most 1 GB

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.list.outputs.apps }}
      sha: ${{ steps.list.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a manual run builds the branch it was started on; everything else builds master
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'master' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # every later job checks out this same commit, so a data commit landing during the run
      # cannot give a site built from two data versions
      - name: List the dashboards (stops if an app needs a file or package the build would not have)
        id: list
        run: |
          echo "apps=$(python scripts/build_pages.py list)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-pages.txt
      - run: pip install -r scripts/requirements-pages.txt
      - name: Render every state of ${{ matrix.app.slug }} (shard ${{ matrix.app.shard }} of ${{ matrix.app.of }})
        run: python scripts/prerender.py _part "${{ matrix.app.entry }}" --jobs 4 --shard "${{ matrix.app.shard }}/${{ matrix.app.of }}"
      - name: Same output as the real Streamlit runtime (sampled states)
        run: python scripts/prerender_check.py _part --per-app ${{ matrix.app.of > 1 && 3 || 6 }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.app.slug }}-${{ matrix.app.shard }}
          path: _part
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false

  verify:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write   # to delete this run's part-* artifacts once the site is assembled
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-pages.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: _site
          merge-multiple: true
      - name: Pages from the build jobs' parts (stops if a shard is missing)
        run: |
          pip install -r scripts/requirements-pages.txt
          python scripts/prerender.py _site --assemble
      - name: Index page (stops unless every dashboard was rendered)
        run: python scripts/build_pages.py index _site
      - name: Size (GitHub Pages limit)
        run: |
          mb=$(du -sm _site | cut -f1)
          echo "site: ${mb} MB, $(find _site/img -type f | wc -l) figures, $(find _site -name '*.html' | wc -l) pages" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt "$SIZE_LIMIT_MB" ]; then echo "site is over ${SIZE_LIMIT_MB} MB"; exit 1; fi
      - name: Install Playwright
        run: |
          pip install playwright==1.64.0
          playwright install chromium --with-deps
      - name: Open every page and select every state (before publishing)
        env:
          ONLY: ${{ inputs.only }}
        run: |
          python -m http.server 8000 --directory _site --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/manifest/index.json && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8000/manifest/index.json || { echo "local server did not start"; cat /tmp/http.log; exit 1; }
          mkdir -p /tmp/local_check && cd /tmp/local_check
          ARGS=()
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          set +e
          python "$GITHUB_WORKSPACE/scripts/pages_check.py" http://127.0.0.1:8000 "${ARGS[@]}"
          rc=$?
          cat pages_check/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $rc
      - name: Keep the local check's summary and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-check-local
          path: /tmp/local_check/pages_check
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # The parts are about as large as the site and are not needed once it is assembled and
      # checked (published or not); artifact storage is shared by the account's repositories.
      - name: Delete this run's part-* artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/runs/$RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("part-")) | .id' > /tmp/ids.txt
          echo "deleting $(wc -l < /tmp/ids.txt) artifacts"
          while read -r id; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id"; done < /tmp/ids.txt

  deploy:
    needs: [plan, verify]
    # a manual run publishes only from master and only when every dashboard was checked
    if: github.event_name != 'workflow_dispatch' || (inputs.publish && inputs.only == '' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  check:
    needs: [plan, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.64.0 pillow==11.3.0
          playwright install chromium --with-deps
      - name: Open every page and select every state (published site)
        id: check
        continue-on-error: true
        env:
          ONLY: ${{ inputs.only }}
        run: |
          mkdir -p pages_check
          ARGS=()
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          python scripts/pages_check.py "https://yasumorishima.github.io/wbc-scouting" "${ARGS[@]}"
      - name: Keep the summary and screenshots on the pages-check branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          mkdir -p pages_check /tmp/out
          cp -r pages_check/. /tmp/out/
          echo "run ${{ github.run_id }} (${{ github.sha }}) check outcome: ${OUTCOME:-not run}" > /tmp/out/RUN.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan pages-check-new
          git rm -rq --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "pages check (run ${{ github.run_id }}): ${OUTCOME:-not run}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages-check-new:pages-check
      - name: Fail if any page failed
        if: steps.check.outcome != 'success'
        run: |
          cat /tmp/out/summary.md || true
          exit 1
