name: Pages (stlite)

# Every WBC app as a static page (stlite runs the unchanged Streamlit app in the browser), plus an
# index page: https://yasumorishima.github.io/wbc-scouting/
# After the deploy, scripts/pages_check.py opens every page in Chromium and checks that it renders;
# its summary and screenshots are kept on the `pages-check` branch (replaced on every run).

on:
  push:
    branches: [master]
    paths:
      - "app_*.py"
      - "players*.py"
      - "scouting_lib.py"
      - "data/**"
      - ".streamlit/config.toml"
      - "scripts/build_pages.py"
      - "scripts/pages_check.py"
      - ".github/workflows/pages.yml"
  # Data refreshes commit with GITHUB_TOKEN, which does not trigger push workflows.
  workflow_run:
    workflows: ["Fetch Statcast Data", "Fetch All Countries Statcast", "Generate Player Files"]
    types: [completed]
  workflow_dispatch:
    inputs:
      memo:
        description: "why this run"
        required: false
      compare_cloud:
        description: "also open each app on Streamlit Cloud and require the same headings, figure counts and player"
        type: boolean
        default: false
      only:
        description: "check only these pages (comma-separated slugs, e.g. japan-batters,qf-jpn-ven); empty = all"
        required: false

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site (stops if an app needs a file or package the page would not have)
        run: python scripts/build_pages.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.64.0 pillow==13.0.0
          playwright install chromium --with-deps
      - name: Rebuild apps.json (same script as the deploy)
        run: python scripts/build_pages.py /tmp/site
      - name: Open every page and check it renders
        id: check
        continue-on-error: true
        env:
          COMPARE_CLOUD: ${{ inputs.compare_cloud }}
          ONLY: ${{ inputs.only }}
        run: |
          mkdir -p pages_check
          ARGS=()
          if [ "$COMPARE_CLOUD" = "true" ]; then ARGS+=(--cloud); fi
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          python scripts/pages_check.py "https://yasumorishima.github.io/wbc-scouting" /tmp/site/apps.json "${ARGS[@]}"
      - name: Keep the summary and screenshots on the pages-check branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          mkdir -p pages_check /tmp/out
          cp -r pages_check/. /tmp/out/
          echo "run ${{ github.run_id }} (${{ github.sha }}) check outcome: ${OUTCOME:-not run}" > /tmp/out/RUN.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan pages-check-new
          git rm -rq --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "pages check (run ${{ github.run_id }}): ${OUTCOME:-not run}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages-check-new:pages-check
      - name: Fail if any page failed
        if: steps.check.outcome != 'success'
        run: |
          cat /tmp/out/summary.md || true
          exit 1
