name: Pages (stlite)

# Every WBC app as a static page (stlite runs the unchanged Streamlit app in the browser), plus an
# index page: https://yasumorishima.github.io/wbc-scouting/
# After the deploy, scripts/pages_check.py opens every page in Chromium and checks that it renders;
# its summary and screenshots are kept on the `pages-check` branch (replaced on every run).
# Note: commits made by other workflows with GITHUB_TOKEN (data refreshes) do not trigger this
# workflow; run it by hand after such a refresh.

on:
  push:
    branches: [master]
    paths:
      - "app_*.py"
      - "players*.py"
      - "scouting_lib.py"
      - "data/**"
      - ".streamlit/config.toml"
      - "scripts/build_pages.py"
      - "scripts/pages_check.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      memo:
        description: "why this run"
        required: false
      compare_cloud:
        description: "also open each app on Streamlit Cloud and require the same headings and figure counts"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site (stops if an app needs a file or package the page would not have)
        run: python scripts/build_pages.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright pillow
          playwright install chromium --with-deps
      - name: Rebuild apps.json (same script as the deploy)
        run: python scripts/build_pages.py /tmp/site
      - name: Open every page and check it renders
        id: check
        continue-on-error: true
        run: |
          CLOUD=""
          if [ "${{ inputs.compare_cloud }}" = "true" ]; then CLOUD="--cloud"; fi
          python scripts/pages_check.py "https://yasumorishima.github.io/wbc-scouting" /tmp/site/apps.json $CLOUD
      - name: Keep the summary and screenshots on the pages-check branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r pages_check/. /tmp/out/
          git checkout -q --orphan pages-check-new
          git rm -rq --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/. .
          echo "run ${{ github.run_id }} (${{ github.sha }})" > RUN.txt
          git add -A
          git commit -qm "pages check (run ${{ github.run_id }})"
          git push -q -f origin pages-check-new:pages-check
      - name: Fail if any page failed
        if: steps.check.outcome != 'success'
        run: |
          cat pages_check/summary.md || true
          exit 1
